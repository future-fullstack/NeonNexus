services:
  tls:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: neonnexus-tls
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /opt/neonnexus-tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/neonnexus-tls/data:/data
      - /opt/neonnexus-tls/config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    pids_limit: 128
    networks:
      - docmost_default

networks:
  docmost_default:
    external: true
