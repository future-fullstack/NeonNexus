server {
    listen 80;
    server_name _;
    root /srv/neonnexus/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /neonnexus/404.html;
    location = /neonnexus/404.html { internal; }

    # Only the prebuilt public files are mounted. Unknown routes stay 404.
    location ~ (^|/)\. { return 404; }
    location ~* /(?:_worker\.js|wrangler\.json|_headers|_redirects)$ { return 404; }
    location = /neonnexus { return 301 /neonnexus/; }
    location = /neonnexus/api/messages {
        access_log off;
        error_log /dev/null;
        client_max_body_size 12k;
        proxy_pass http://neonnexus-messages:8091;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /neonnexus/ { try_files $uri $uri/ =404; }
    location / { return 404; }
}
