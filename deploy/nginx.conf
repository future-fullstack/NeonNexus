# Port 80 is the existing HTTP gateway reached through :8080.
# It never accepts secrets; the exact legacy API route is redirected too.
server {
    listen 80;
    server_name _;
    server_tokens off;
    location = /neonnexus { return 308 https://39.96.71.56/neonnexus/; }
    location /neonnexus/ { return 308 https://39.96.71.56$request_uri; }
    location / { return 404; }
}

# Private Docker port, not published on the host; Caddy terminates trusted TLS.
server {
    listen 81;
    server_name _;
    server_tokens off;
    charset utf-8;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream neonnexus-messages:8091;
    set $web_upstream neonnexus-web:4321;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /neonnexus { return 308 /neonnexus/; }
    location ~ (^|/)\. { return 404; }

    location = /neonnexus/api/messages {
        access_log off;
        error_log /dev/null;
        client_max_body_size 12k;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location = /neonnexus/api/v1/owner/media {
        access_log off;
        error_log /dev/null;
        client_max_body_size 4m;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location ^~ /neonnexus/api/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location ^~ /neonnexus/media/ {
        access_log off;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /neonnexus/ {
        proxy_pass http://$web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
